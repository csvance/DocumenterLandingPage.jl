# Rebuilds and deploys the versioned docs for an existing release tag:
#
#   gh workflow run "Docs backfill" -f tag=v0.2.2
#
# For tags whose release build never ran: in v0.1.0 through v0.2.2 the docs
# job in Documenter.yml was skipped on every tag push, because the `changes`
# job it needs is skipped for tags and the job's `if` had no status function.
# Dispatching Documenter.yml with `--ref <tag>` cannot do this: a dispatch runs
# the workflow file as it exists at that ref, and those tags have no
# workflow_dispatch trigger. So this runs from main and checks the tag's tree
# out instead, building it with the tag's own docs/ environment.
#
# Backfill oldest first: Documenter points `stable` at the highest version it
# has deployed, so the order only matters for what the intermediate states show.
name: Docs backfill

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.2.2"
        required: true

# One backfill at a time: each run pushes to gh-pages, and two concurrent pushes
# would race.
concurrency:
  group: docs-backfill
  cancel-in-progress: false

# contents: write is needed because deploydocs pushes the built site to the
# gh-pages branch; actions: write because julia-actions/cache prunes its own
# old caches.
permissions:
  contents: write
  actions: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0
      - name: Install Julia dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          TAG: ${{ inputs.tag }}
        # Documenter treats a workflow_dispatch run as a release build when
        # GITHUB_REF names a tag, but a dispatch from main reports
        # refs/heads/main. Set inside the Julia process, since a step cannot
        # reliably override GitHub's own GITHUB_* variables.
        run: julia --project=docs -e 'ENV["GITHUB_REF"] = "refs/tags/" * ENV["TAG"]; include("docs/make.jl")'
