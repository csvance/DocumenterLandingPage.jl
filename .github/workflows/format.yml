# Runic formatting check: every .jl file in the repo must be Runic-formatted.
# Run `runic --inplace .` locally and commit the result; this check fails
# until the whole tree is formatted.
name: Format

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

# actions: write is needed because julia-actions/cache prunes its own old
# caches.
permissions:
  contents: read
  actions: write

jobs:
  runic:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: fredrikekre/runic-action@96f1a78f233c313e349afcb770728471371d5887 # v1
        with:
          # Keep in sync with the local `runic` CLI:
          #   julia -e 'using Pkg; Pkg.Apps.add("Runic")'
          version: '1.7'
