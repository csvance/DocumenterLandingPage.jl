# Runic formatting check: every .jl file in the repo must be Runic-formatted.
# Run `runic --inplace .` locally and commit the result; this check fails
# until the whole tree is formatted.
name: Format

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

# actions: write is needed because julia-actions/cache prunes its own old
# caches.
permissions:
  contents: read
  actions: write

jobs:
  runic:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0
      - uses: fredrikekre/runic-action@96f1a78f233c313e349afcb770728471371d5887 # v1
        with:
          # Keep in sync with the local `runic` CLI:
          #   julia -e 'using Pkg; Pkg.Apps.add("Runic")'
          version: '1.7'
