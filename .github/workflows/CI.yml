# Test CI on the supported Julia versions: 1.10 is the floor from the
# Project.toml compat, 1.12 is the current release (the versions used for
# local development and the docs build). The test suite builds the docsite
# fixture twice: once with both plugins (LandingPage + CodeBlocks) and once
# with base Documenter only, as a subprocess that must never load
# DocumenterCodeBlocks.
#
# A `changes` job computes whether anything the tests depend on changed; the
# test job runs only when it has, so README-only or docs-only edits don't
# burn runner time. A skipped test job counts as success for required-check
# gating.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# actions: write is needed because julia-actions/cache prunes its own old
# caches.
permissions:
  contents: read
  actions: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter reads changed files from the PR
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # The plugin's code, tests, bundled stylesheet, and the workflow
          # itself. docs/ is the plugin's own documentation site, which the
          # test suite does not cover, so a docs-only change skips the tests.
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'assets/**'
              - 'Project.toml'
              - '.github/workflows/CI.yml'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'
